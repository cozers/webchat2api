name: Sync Upstream Tags

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest upstream tag and publish matching tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zqbxdev/webchat2api.git || git remote set-url upstream https://github.com/zqbxdev/webchat2api.git

          latest_tag="$(
            git ls-remote --tags --refs upstream 'v*' |
              awk -F/ '{print $NF}' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$latest_tag" ]; then
            echo "No upstream tag found."
            exit 0
          fi

          if git ls-remote --exit-code --tags --refs origin "refs/tags/${latest_tag}" >/dev/null 2>&1; then
            echo "Tag ${latest_tag} already exists in this fork."
            exit 0
          fi

          git fetch origin main --tags
          git fetch upstream --tags --force

          git checkout main
          git pull --ff-only origin main
          git merge --no-edit --no-ff "refs/tags/${latest_tag}"
          git tag -a "${latest_tag}" -m "Release ${latest_tag}"
          git push origin main
          git push origin "${latest_tag}"
