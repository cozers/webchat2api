name: Sync Upstream Tags

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest upstream release tag
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/zqbxdev/webchat2api.git || git remote set-url upstream https://github.com/zqbxdev/webchat2api.git

          latest_tag="$(
            git ls-remote --tags --refs upstream 'v*' |
              awk -F/ '{print $NF}' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$latest_tag" ]; then
            echo "No upstream release tag found."
            exit 0
          fi

          if git ls-remote --exit-code --tags --refs origin "refs/tags/${latest_tag}" >/dev/null 2>&1; then
            echo "Tag ${latest_tag} already exists in this fork."
            exit 0
          fi

          git fetch --no-tags --force upstream "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
          git push origin "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
