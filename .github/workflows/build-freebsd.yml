name: Build FreeBSD Binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freebsd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web assets
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix web install
          NEXT_PUBLIC_APP_VERSION="$(cat VERSION)" npm --prefix web run build
          rm -rf web_dist
          cp -R web/out web_dist

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(cat VERSION)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build FreeBSD binary
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y python313 git gcc gmake pkgconf rust openssl postgresql16-client jpeg-turbo tiff webp lcms2 freetype2 openjpeg
          run: |
            set -eux
            python3.13 -m venv .venv
            . .venv/bin/activate
            python -m ensurepip --upgrade
            python -m pip install --upgrade pip setuptools wheel pyinstaller
            python - <<'PY'
            import tomllib

            with open("pyproject.toml", "rb") as file:
                project = tomllib.load(file)["project"]

            dependencies = [
                dependency for dependency in project["dependencies"]
                if not dependency.lower().startswith("curl-cffi")
            ]
            dependencies.append("httpx[socks]>=0.28.1")

            with open("requirements-freebsd.txt", "w", encoding="utf-8") as file:
                file.write("\n".join(dependencies))
                file.write("\n")
            PY
            python -m pip install -r requirements-freebsd.txt
            cp -R packaging/freebsd/curl_cffi ./curl_cffi
            pyinstaller \
              --clean \
              --onefile \
              --name webchat2api-freebsd-amd64 \
              --add-data web_dist:web_dist \
              --add-data VERSION:. \
              --hidden-import uvicorn.loops.auto \
              --hidden-import uvicorn.protocols.http.auto \
              --hidden-import uvicorn.protocols.websockets.auto \
              main.py
            ls -lh dist/webchat2api-freebsd-amd64
            file dist/webchat2api-freebsd-amd64
            size="$(stat -f %z dist/webchat2api-freebsd-amd64)"
            test "${size}" -gt 10000000

      - name: Validate binary
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh dist/webchat2api-freebsd-amd64
          file dist/webchat2api-freebsd-amd64
          size="$(stat -c %s dist/webchat2api-freebsd-amd64)"
          test "${size}" -gt 10000000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webchat2api-freebsd-amd64
          path: dist/webchat2api-freebsd-amd64
          if-no-files-found: error

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/webchat2api-freebsd-amd64
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
